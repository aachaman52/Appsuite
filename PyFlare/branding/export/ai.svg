<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <radialGradient id="aiCore" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </radialGradient>
  <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
