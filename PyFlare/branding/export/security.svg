<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF55"/>
    <stop offset="100%" stop-color="#5B5FFF00"/>
  </radialGradient>
  <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feFlood flood-color="#00D4FF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <!-- Shield body -->
  <path d="M256,52 L400,104 L400,268
           C400,362 334,432 256,472
           C178,432 112,362 112,268 L112,104 Z"
        fill="url(#shieldGrad)" filter="url(#shieldShadow)"/>
  <!-- Shield inner highlight -->
  <path d="M256,80 L380,124 L380,268
           C380,350 322,412 256,448
           C190,412 132,350 132,268 L132,124 Z"
        fill="url(#shieldGlow)" opacity="0.4"/>
  <!-- Checkmark -->
  <path d="M176,248 L228,300 L336,192"
        stroke="url(#checkGrad)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#checkGlow)"/>

</svg>