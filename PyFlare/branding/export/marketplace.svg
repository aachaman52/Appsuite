<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="bagGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feFlood flood-color="#5B5FFF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <!-- Bag body with trapezoid shape -->
  <path d="M80,168 L432,168 L388,436 L124,436 Z"
        fill="url(#bagGrad)" filter="url(#bagShadow)"/>
  <!-- Gloss overlay -->
  <path d="M80,168 L432,168 L420,232 L92,232 Z"
        fill="white" opacity="0.06"/>
  <!-- Handle arcs -->
  <path d="M168,168 v-44 a88,88 0 0 1 176,0 v44"
        stroke="url(#handleGrad)" stroke-width="24"
        stroke-linecap="round" fill="none" filter="url(#bagGlow)"/>
  <!-- Center tag label -->
  <rect x="208" y="280" width="96" height="56" rx="12" fill="#0B0F19" opacity="0.5"/>
  <line x1="256" y1="280" x2="256" y2="224" stroke="#00D4FF"
        stroke-width="6" stroke-dasharray="4,4" opacity="0.5"/>

</svg>