<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="flameGrad" x1="20%" y1="0%" x2="80%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="50%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <linearGradient id="flameLeft" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF99"/>
    <stop offset="100%" stop-color="#5B5FFF00"/>
  </radialGradient>
  <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="16" result="blur"/>
    <feFlood flood-color="#00D4FF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="flameShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
</defs>

  <!-- Outer left petal -->
  <path d="M256,52 C195,120 128,205 128,320 C128,400 185,456 240,472
           C200,440 178,380 195,298 C210,228 240,178 256,148 Z"
        fill="url(#flameLeft)" filter="url(#flameShadow)"/>
  <!-- Outer right petal -->
  <path d="M256,52 C317,120 384,205 384,320 C384,400 327,456 272,472
           C312,440 334,380 317,298 C302,228 272,178 256,148 Z"
        fill="url(#flameGrad)" filter="url(#flameShadow)"/>
  <!-- Core inner flame -->
  <path d="M256,140 C220,210 196,278 196,340 C196,410 226,460 256,472
           C286,460 316,410 316,340 C316,278 292,210 256,140 Z"
        fill="url(#flameGrad)" filter="url(#flameGlow)"/>
  <!-- Glow core -->
  <ellipse cx="256" cy="380" rx="48" ry="36" fill="url(#glowCenter)" opacity="0.7"/>

</svg>