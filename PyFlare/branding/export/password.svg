<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#3B82F6"/>
  </linearGradient>
  <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#00D4FF00"/>
  </radialGradient>
  <filter id="passShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

  <!-- Card body -->
  <rect x="60" y="148" width="392" height="216" rx="36"
        fill="#111827" stroke="url(#passGrad)" stroke-width="20"
        filter="url(#passShadow)"/>
  <!-- Gloss line -->
  <rect x="60" y="148" width="392" height="72" rx="36"
        fill="white" opacity="0.04"/>
  <!-- Key icon left -->
  <circle cx="148" cy="260" r="36" fill="none" stroke="url(#passGrad)"
          stroke-width="16"/>
  <line x1="184" y1="260" x2="240" y2="260" stroke="url(#passGrad)"
        stroke-width="16" stroke-linecap="round"/>
  <line x1="232" y1="260" x2="232" y2="288" stroke="url(#passGrad)"
        stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="260" x2="210" y2="280" stroke="url(#passGrad)"
        stroke-width="14" stroke-linecap="round"/>
  <!-- Dot indicators -->
  <circle cx="320" cy="260" r="14" fill="url(#dotGlow)"/>
  <circle cx="364" cy="260" r="14" fill="url(#dotGlow)"/>
  <circle cx="408" cy="260" r="14" fill="url(#dotGlow)" opacity="0.4"/>

</svg>