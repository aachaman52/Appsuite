<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="pwrGrad" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <filter id="pwrGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feFlood flood-color="#00D4FF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="pwrShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
</defs>

  <!-- Ring arc -->
  <path d="M148,176 A132,132 0 1 0 364,176"
        stroke="url(#pwrGrad)" stroke-width="36" stroke-linecap="round"
        fill="none" filter="url(#pwrGlow)"/>
  <!-- Stem -->
  <line x1="256" y1="56" x2="256" y2="216"
        stroke="url(#pwrGrad)" stroke-width="36" stroke-linecap="round"
        filter="url(#pwrGlow)"/>
  <!-- Inner ring glow -->
  <circle cx="256" cy="280" r="60" fill="none"
          stroke="url(#pwrGrad)" stroke-width="4" opacity="0.3"/>

</svg>