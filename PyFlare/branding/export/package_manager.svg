<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#8A5CF5"/>
    <stop offset="100%" stop-color="#5B5FFF88"/>
  </linearGradient>
  <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
</defs>

  <!-- Isometric box — front face -->
  <polygon points="256,290 100,200 100,380 256,470"
           fill="url(#boxFront)" filter="url(#boxShadow)"/>
  <!-- Right/side face -->
  <polygon points="256,290 412,200 412,380 256,470"
           fill="url(#boxSide)"/>
  <!-- Top face -->
  <polygon points="256,120 412,200 256,290 100,200"
           fill="url(#boxTop)"/>
  <!-- Top edge ribbon -->
  <line x1="256" y1="120" x2="256" y2="290"
        stroke="white" stroke-width="6" opacity="0.2"/>
  <!-- Center crease lines -->
  <line x1="100" y1="200" x2="412" y2="200"
        stroke="white" stroke-width="4" opacity="0.15"/>

</svg>