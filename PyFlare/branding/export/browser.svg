<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <radialGradient id="globeShine" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="white"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <filter id="globeShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

  <!-- Address bar background -->
  <rect x="52" y="52" width="408" height="56" rx="16"
        fill="#111827" stroke="url(#barGrad)" stroke-width="4"/>
  <!-- Traffic lights -->
  <circle cx="92"  cy="80" r="10" fill="#EF4444"/>
  <circle cx="120" cy="80" r="10" fill="#F59E0B"/>
  <circle cx="148" cy="80" r="10" fill="#10B981"/>
  <!-- URL bar fill -->
  <rect x="176" y="64" width="248" height="28" rx="8"
        fill="#0B0F19" opacity="0.8"/>
  <!-- Globe outer ring -->
  <circle cx="256" cy="316" r="168" fill="none"
          stroke="url(#globeGrad)" stroke-width="24"
          filter="url(#globeShadow)"/>
  <!-- Meridian ellipse -->
  <ellipse cx="256" cy="316" rx="76" ry="168" fill="none"
           stroke="url(#globeGrad)" stroke-width="14"/>
  <!-- Equator line -->
  <line x1="88" y1="316" x2="424" y2="316"
        stroke="url(#globeGrad)" stroke-width="14"/>
  <!-- Tropic arcs -->
  <path d="M112,248 Q256,220 400,248" stroke="url(#globeGrad)"
        stroke-width="10" fill="none" opacity="0.5"/>
  <path d="M112,384 Q256,412 400,384" stroke="url(#globeGrad)"
        stroke-width="10" fill="none" opacity="0.5"/>
  <!-- Shine highlight -->
  <ellipse cx="220" cy="280" rx="36" ry="24"
           fill="url(#globeShine)" opacity="0.12" transform="rotate(-20,220,280)"/>

</svg>