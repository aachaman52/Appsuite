os:
  name: "AppSuite OS"
  version: "1.0.0-beta"
  codename: "Jarvis"
  base: "ubuntu-24.04-live-server-amd64"
  base_url: "https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso"
  iso_label: "APPSUITE_OS"

desktop:
  environment: "gnome" # Options: gnome, kde, xfce
  theme: "AppSuite-Dark"
  icon_theme: "AppSuite-Icons"

user:
  default_username: "appsuite"
  default_password: "password" # Required for live session; installer will override
  hostname: "appsuite-os"
