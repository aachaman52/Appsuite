# PyFlare OS — Expanded Package Manifest

# ============================================================
# APT REPOSITORIES
# ============================================================
repositories:
  # Core PyPI/SNAP/Flatpak sources handled post-install
  # APT PPAs added here
  - name: "flatpak"
    type: "apt"

# ============================================================
# BASE SYSTEM
# ============================================================
packages:
  base:
    - ubuntu-standard
    - ubuntu-minimal
    - linux-generic-hwe-24.04
    - linux-headers-generic-hwe-24.04
    - initramfs-tools
    - grub-pc
    - grub-efi-amd64
    - grub-efi-amd64-signed
    - shim-signed
    - efibootmgr
    - os-prober
    - systemd
    - systemd-resolved
    - systemd-timesyncd
    - udev
    - dbus
    - polkit
    - udisks2
    - upower
    - acpid

  # ============================================================
  # DESKTOP ENVIRONMENT — GNOME
  # ============================================================
  desktop:
    - gnome-shell
    - gnome-session
    - gnome-control-center
    - gnome-tweaks
    - gnome-shell-extensions
    - gdm3
    - gvfs
    - gvfs-backends
    - nautilus
    - nautilus-extension-gnome-terminal
    - gnome-terminal
    - gnome-disk-utility
    - gnome-system-monitor
    - gnome-calculator
    - gnome-text-editor
    - gnome-screenshot
    - gnome-keyring
    - libpam-gnome-keyring
    - seahorse
    - baobab
    - evince
    - eog
    - file-roller
    - gedit
    - cheese
    - totem
    - rhythmbox
    - simple-scan

  # ============================================================
  # DISPLAY & GRAPHICS
  # ============================================================
  graphics:
    - xorg
    - xserver-xorg-core
    - xserver-xorg-input-libinput
    - mesa-utils
    - libgl1-mesa-dri
    - libgles2-mesa
    - vulkan-tools
    - libvulkan1
    - nvidia-driver-535        # NVIDIA (auto-fallback to mesa if absent)
    - amdgpu-pro               # AMD (optional)
    - intel-media-va-driver    # Intel VA-API

  # ============================================================
  # PLYMOUTH BOOT SPLASH
  # ============================================================
  plymouth:
    - plymouth
    - plymouth-themes
    - plymouth-theme-spinner

  # ============================================================
  # AUDIO
  # ============================================================
  audio:
    - pipewire
    - pipewire-alsa
    - pipewire-pulse
    - pipewire-jack
    - wireplumber
    - pavucontrol
    - alsa-utils

  # ============================================================
  # NETWORKING
  # ============================================================
  networking:
    - network-manager
    - network-manager-gnome
    - network-manager-openvpn
    - network-manager-openvpn-gnome
    - wireless-tools
    - wpasupplicant
    - curl
    - wget
    - openssh-client
    - openssh-server
    - nftables
    - ufw
    - avahi-daemon

  # ============================================================
  # FONTS
  # ============================================================
  fonts:
    - fonts-noto
    - fonts-noto-cjk
    - fonts-noto-color-emoji
    - fonts-liberation
    - fonts-ubuntu
    - fonts-freefont-ttf
    - fontconfig

  # ============================================================
  # PRINTING
  # ============================================================
  printing:
    - cups
    - system-config-printer
    - printer-driver-gutenprint

  # ============================================================
  # DEVELOPMENT TOOLS
  # ============================================================
  development:
    - git
    - git-lfs
    - python3
    - python3-pip
    - python3-venv
    - python3-dev
    - python3-setuptools
    - python3-wheel
    - build-essential
    - cmake
    - make
    - gcc
    - g++
    - clang
    - lldb
    - gdb
    - valgrind
    - strace
    - pkg-config
    - libssl-dev
    - libffi-dev
    - libsqlite3-dev
    - jq
    - tree
    - tmux
    - htop
    - neofetch
    - unzip
    - zip
    - p7zip-full

  # ============================================================
  # CONTAINERS & VIRTUALISATION
  # ============================================================
  containers:
    - docker.io
    - docker-compose
    - containerd
    - flatpak
    - gnome-software-plugin-flatpak

  # ============================================================
  # PYFLARE APPLICATIONS (installed via pip/custom)
  # ============================================================
  pyflare:
    - python3-pil
    - python3-numpy
    - python3-requests
    - python3-yaml
    - python3-gi
    - gir1.2-gtk-4.0
    - gir1.2-adw-1
    - libadwaita-1-dev

  # ============================================================
  # UTILITIES
  # ============================================================
  utilities:
    - vim
    - nano
    - less
    - man-db
    - bash-completion
    - command-not-found
    - software-properties-common
    - apt-transport-https
    - ca-certificates
    - gnupg
    - lsb-release
    - debconf-utils
    - gdebi
    - synaptic
    - timeshift

# ============================================================
# PACKAGES TO REMOVE (debloat)
# ============================================================
remove:
  - thunderbird
  - transmission-gtk
  - gnome-mahjongg
  - gnome-mines
  - gnome-sudoku
  - aisleriot
  - ubuntu-web-launchers
  - apport
  - whoopsie

# ============================================================
# SNAP PACKAGES
# ============================================================
snaps:
  - name: firefox
    channel: stable
  - name: code
    channel: stable
    classic: true

# ============================================================
# FLATPAK APPLICATIONS (Flathub)
# ============================================================
flatpaks:
  - org.mozilla.firefox
  - com.visualstudio.code
  - org.gimp.GIMP
  - org.inkscape.Inkscape
  - io.github.flattool.Warehouse

# ============================================================
# CUSTOM INSTALL COMMANDS
# ============================================================
custom_installs:
  # Ollama AI runtime
  - description: "Install Ollama"
    command: "curl -fsSL https://ollama.com/install.sh | sh"
    condition: "network"
  # PyFlare Python packages
  - description: "Install PyFlare Python dependencies"
    command: "pip3 install Pillow cairosvg tqdm colorama numpy requests pyyaml imageio svglib reportlab"
    condition: "always"
