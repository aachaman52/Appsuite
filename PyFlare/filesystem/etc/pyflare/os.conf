# PyFlare OS main configuration
# /etc/pyflare/os.conf

[general]
name=PyFlare OS
version=1.0.0
codename=Ember
build_date=2026-07-30
vendor=PyFlare Project
vendor_url=https://pyflare.dev

[paths]
home=/opt/pyflare
data=/var/lib/pyflare
config=/etc/pyflare
log=/var/log/pyflare
cache=/var/cache/pyflare
run=/run/pyflare

[engine]
enabled=true
autostart=true
port=7700
bind_address=127.0.0.1
ai_backend=ollama
ai_model=llama3.2

[store]
enabled=true
backend_url=https://store.pyflare.dev/api/v1
cache_dir=/var/cache/pyflare/store

[updates]
enabled=true
check_interval=86400
auto_download=false
auto_install=false
update_url=https://updates.pyflare.dev/noble/stable

[ui]
theme=PyFlare-Dark
icons=PyFlare-Icons
cursor=PyFlare
font_ui=Inter 11
font_mono=JetBrains Mono 11
animations=true
transparency=true

[privacy]
telemetry=false
crash_reports=false
usage_stats=false
