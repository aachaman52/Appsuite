<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aachman Studios — Ecosystem Product Film (2026)</title>
  <meta name="description" content="A cinematic technology documentary trailer introducing the Aachman Studios ecosystem: AppSuite, PyFlare OS, Jarvis AI, and GameDevAI.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <!-- Top HUD Header -->
    <header class="hud-header">
      <div class="brand-identity">
        <!-- Official Aachman Studios Logo Image -->
        <img class="brand-logo" src="aachmanstiudios.png" alt="Aachman Studios Logo" height="34" style="object-fit: contain;">
        <span class="brand-title">AACHMAN STUDIOS</span>
        <span class="brand-divider">/</span>
        <span class="brand-subtitle">ECOSYSTEM TRAILER (2026)</span>
      </div>

      <div class="hud-status">
        <div class="active-scene-badge" id="scene-badge">SCENE 1: THE PROBLEM</div>
        <div class="fps-counter" id="fps-display">60 FPS</div>
      </div>
    </header>

    <!-- Main Canvas Viewport -->
    <main class="viewport-wrapper">
      <canvas id="trailer-canvas" width="1920" height="1080"></canvas>
      
      <!-- Subtitle & Narration Overlay -->
      <div class="narration-overlay" id="narration-container">
        <div class="narration-speaker" id="narration-speaker">NARRATION</div>
        <div class="narration-text" id="narration-text">
          Game development shouldn't feel like managing 20 different systems.
        </div>
      </div>
    </div>

    <!-- Bottom HUD Timeline & Playback Bar -->
    <footer class="hud-footer">
      <div class="timeline-container">
        <div class="timeline-bar" id="timeline-bar">
          <div class="timeline-progress" id="timeline-progress"></div>
          <div class="timeline-scrubber" id="timeline-scrubber"></div>
          
          <!-- Scene Markers -->
          <div class="scene-markers">
            <button class="marker" style="left: 0%;" data-time="0" title="Scene 1: The Problem (0-10s)">S1</button>
            <button class="marker" style="left: 11.11%;" data-time="10" title="Scene 2: The Vision (10-20s)">S2</button>
            <button class="marker" style="left: 22.22%;" data-time="20" title="Scene 3: AppSuite + Jarvis (20-35s)">S3</button>
            <button class="marker" style="left: 38.88%;" data-time="35" title="Scene 4: Intelligent Model Routing (35-47s)">S4</button>
            <button class="marker" style="left: 52.22%;" data-time="47" title="Scene 5: PyFlare OS (47-62s)">S5</button>
            <button class="marker" style="left: 68.88%;" data-time="62" title="Scene 6: Developer Workflow (62-75s)">S6</button>
            <button class="marker" style="left: 83.33%;" data-time="75" title="Scene 7: Ecosystem Tree (75-85s)">S7</button>
            <button class="marker" style="left: 94.44%;" data-time="85" title="Final Scene: Aachman Studios (85-90s)">END</button>
          </div>
        </div>
      </div>

      <div class="controls-container">
        <div class="controls-left">
          <button id="btn-play" class="btn-control primary" aria-label="Play or Pause">
            <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>
          <button id="btn-restart" class="btn-control" title="Restart Trailer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
          </button>
          <div class="time-code" id="time-display">00:00.0 / 01:30.0</div>
        </div>

        <div class="controls-center">
          <span class="scene-title-active" id="scene-title-active">Scene 1 — The Problem</span>
        </div>

        <div class="controls-right">
          <button id="btn-audio" class="btn-control active" title="Toggle Synth Sound & Audio">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <span>AUDIO</span>
          </button>

          <button id="btn-subtitles" class="btn-control active" title="Toggle Subtitles">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/>
            </svg>
            <span>SUBS</span>
          </button>

          <select id="speed-select" class="speed-selector" title="Playback Speed">
            <option value="0.5">0.5x Speed</option>
            <option value="1.0" selected>1.0x Speed</option>
            <option value="1.5">1.5x Speed</option>
            <option value="2.0">2.0x Speed</option>
          </select>

          <button id="btn-export-mp4" class="btn-control primary" title="Record and Export Video">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
            <span>EXPORT MP4</span>
          </button>

          <button id="btn-fullscreen" class="btn-control" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
