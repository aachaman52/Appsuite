---
# Calamares installer configuration for PyFlare OS

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: welcome
    module: welcome
  - id: locale
    module: locale
  - id: keyboard
    module: keyboard
  - id: partition
    module: partition
  - id: users
    module: users
  - id: summary
    module: summary
  - id: install
    module: unpackfs
  - id: bootloader
    module: bootloader
  - id: finish
    module: finished

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - pyflare-postinstall
  - show:
    - finish

branding: pyflare
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quitOnExecErrors: false
log-level: info
crash-reporter: ""
