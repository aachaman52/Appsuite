<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; padding: 40px;
      background: #0C0F1E;
      color: #E6EDF3;
      font-family: 'Inter', 'Ubuntu', sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; box-sizing: border-box;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 640px;
      text-align: center;
    }
    h1 {
      font-family: 'Space Grotesk', 'Ubuntu', sans-serif;
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, #3B5BDB, #00BFFF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    p { font-size: 1.05rem; color: #8B949E; line-height: 1.7; }
    .logo { font-size: 3rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔥</div>
    <h1>Built for Developers</h1>
    <p>JetBrains Mono, Docker, Git LFS, Python 3, and the full build toolchain — ready the moment you log in.</p>
  </div>
</body>
</html>
