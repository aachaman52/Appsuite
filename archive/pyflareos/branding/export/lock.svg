<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="lockBody" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <linearGradient id="lockShackle" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="lockGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feFlood flood-color="#5B5FFF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <!-- Shackle -->
  <path d="M164,216 v-88 a92,92 0 0 1 184,0 v88"
        stroke="url(#lockShackle)" stroke-width="28" stroke-linecap="round"
        fill="none" filter="url(#lockGlow)"/>
  <!-- Body -->
  <rect x="96" y="212" width="320" height="244" rx="28"
        fill="url(#lockBody)" filter="url(#lockShadow)"/>
  <!-- Keyhole ring -->
  <circle cx="256" cy="312" r="28" fill="#0B0F19" opacity="0.9"/>
  <!-- Keyhole stem -->
  <rect x="246" y="326" width="20" height="44" rx="10" fill="#0B0F19" opacity="0.9"/>

</svg>