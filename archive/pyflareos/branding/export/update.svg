<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="arrGrad1" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <linearGradient id="arrGrad2" x1="100%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <filter id="arrGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feFlood flood-color="#00D4FF" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <!-- Outer clockwise arc -->
  <path d="M140,256 A116,116 0 1 1 372,372"
        stroke="url(#arrGrad1)" stroke-width="32" stroke-linecap="round"
        fill="none" filter="url(#arrGlow)"/>
  <!-- Outer arrowhead -->
  <polygon points="372,372 316,308 428,308" fill="url(#arrGrad1)"/>
  <!-- Inner counter-clockwise arc -->
  <path d="M372,256 A116,116 0 1 1 140,140"
        stroke="url(#arrGrad2)" stroke-width="24" stroke-linecap="round"
        fill="none"/>
  <!-- Inner arrowhead -->
  <polygon points="140,140 196,204 84,204" fill="url(#arrGrad2)"/>

</svg>