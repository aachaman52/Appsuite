<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#5B5FFF"/>
  </linearGradient>
  <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#5B5FFF"/>
    <stop offset="100%" stop-color="#8A5CF5"/>
  </linearGradient>
  <filter id="storeShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
</defs>

  <!-- Building body -->
  <rect x="76" y="200" width="360" height="280" rx="12"
        fill="url(#storeGrad)" filter="url(#storeShadow)"/>
  <!-- Roof / awning -->
  <polygon points="52,200 256,80 460,200"
           fill="url(#roofGrad)"/>
  <!-- Windows -->
  <rect x="116" y="252" width="100" height="80" rx="8"
        fill="#0B0F19" opacity="0.6"/>
  <rect x="296" y="252" width="100" height="80" rx="8"
        fill="#0B0F19" opacity="0.6"/>
  <!-- Door -->
  <rect x="200" y="360" width="112" height="120" rx="10"
        fill="#0B0F19" opacity="0.6"/>
  <!-- Awning stripe -->
  <rect x="52" y="188" width="408" height="20" rx="6"
        fill="#00D4FF" opacity="0.4"/>

</svg>