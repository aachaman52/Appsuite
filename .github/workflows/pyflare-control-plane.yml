name: PyFlare Control Plane

on:
  push:
    paths:
      - "PyFlare/control_plane/**"
      - "PyFlare/integrations/unity/**"
      - ".github/workflows/pyflare-control-plane.yml"
  pull_request:
    paths:
      - "PyFlare/control_plane/**"
      - "PyFlare/integrations/unity/**"
      - ".github/workflows/pyflare-control-plane.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: PyFlare/control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -v
