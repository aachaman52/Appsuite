name: PyFlare CI

on:
  push:
    branches:
      - main
      - refactor/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]

      - name: Scan for committed secrets
        run: |
          echo "Scanning tracked files for potential API keys..."
          python -c "
          import re, sys
          from pathlib import Path

          PATTERNS = [
              re.compile(r'AIzaSy[0-9A-Za-z_-]{33}'),
              re.compile(r'sk-[a-zA-Z0-9]{32,}'),
              re.compile(r'nvapi-[a-zA-Z0-9_-]{32,}'),
          ]
          violations = []
          for p in Path('.').rglob('*'):
              if any(part.startswith('.') or part in ('archive', 'node_modules', 'dist', 'build') for part in p.parts):
                  continue
              if p.is_file() and p.suffix in ('.py', '.json', '.yaml', '.yml', '.md', '.txt', '.env.example'):
                  try:
                      content = p.read_text(encoding='utf-8')
                      for pattern in PATTERNS:
                          if pattern.search(content):
                              violations.append(str(p))
                              break
                  except Exception:
                      pass
          if violations:
              print(f'ERROR: Potential secrets detected in: {violations}', file=sys.stderr)
              sys.exit(1)
          print('Secret scan clean: 0 hardcoded keys detected in active source.')
          "

      - name: Run Ruff Linter
        run: |
          python -m ruff check .

      - name: Run mypy Type Check (Report Typing Debt)
        run: |
          python -m mypy src/pyflare --explicit-package-bases || true

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/unit --cov=pyflare --cov-report=term --cov-report=xml

      - name: Run Integration Tests
        run: |
          pytest tests/integration

      - name: Verify CLI Entry Points
        run: |
          pyflare --version
          pyflare doctor
          pyflare plan "Generate a testing scene"
